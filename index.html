<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Colaborativa</title>
  <style>
    :root {
      --bg-color: #F4F6F8; --card-color: #FFFFFF; --accent-color: #007BFF;
      --accent-hover: #0056b3; --text-primary: #212529; --text-secondary: #6c757d;
      --border-color: #DEE2E6; --shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; background-color: var(--bg-color); color: var(--text-primary);
      display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
    }
    .app-container { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
    .main-content { display: flex; flex-direction: column; }
    .player-container { position: relative; padding-bottom: 56.25%; height: 0; background-color: #000; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .status-display { text-align: center; padding: 12px; margin-top: 15px; font-size: 1.1em; font-weight: 500; color: var(--text-secondary); background-color: var(--card-color); border-radius: 8px; }
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    .card { background-color: var(--card-color); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
    .card h3 { margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; font-size: 1.2em; display: flex; justify-content: space-between; align-items: center; }
    #videoUrl, #password-input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background-color: #F8F9FA; color: var(--text-primary); margin-bottom: 10px; }
    #addButton, #refreshButton, #password-submit-button { padding: 12px; border: none; border-radius: 6px; background-color: var(--accent-color); color: white; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
    #addButton { width: 100%; }
    #addButton:hover, #password-submit-button:hover { background-color: var(--accent-hover); }
    #refreshButton { background-color: var(--text-secondary); font-size: 0.8em; padding: 8px 12px; }
    #playlist { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
    .playlist-item { display: flex; align-items: center; gap: 15px; padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background-color 0.2s; }
    .playlist-item:hover { background-color: #f8f9fa; }
    .playlist-item.active { background-color: #e7f3ff; }
    .playlist-item-thumbnail { width: 80px; height: 45px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .playlist-item-info { display: flex; flex-direction: column; overflow: hidden; }
    .playlist-item-title { font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-item-author { font-size: 0.9em; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-item.active .playlist-item-title { color: var(--accent-color); }
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 14px 28px; background-color: var(--accent-color); color: white; border-radius: 25px; opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s; z-index: 1000; box-shadow: var(--shadow); }
    #toast.show { opacity: 1; visibility: visible; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .modal-card { background: var(--card-color); padding: 30px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; }
    .modal-card p { color: var(--text-secondary); }
    .modal-error { color: #dc3545; margin-top: 10px; height: 20px; }
    @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } .sidebar { order: -1; } }
  </style>
</head>
<body>
  
  <div class="modal-overlay" id="password-modal">
    <div class="modal-card">
      <h3>Permiso Requerido</h3>
      <p>Ingresa la contraseña para cambiar la canción.</p>
      <input type="password" id="password-input" placeholder="Contraseña de DJ">
      <button id="password-submit-button">Autorizar</button>
      <div class="modal-error" id="password-error"></div>
    </div>
  </div>
  
  <div class="app-container" id="app-container">
    <div class="main-content">
      <div class="player-container"><div id="player"></div></div>
      <div id="statusDisplay" class="status-display">Conectando...</div>
    </div>
    <div class="sidebar">
      <div class="card">
        <h3>Añadir Canción</h3>
        <input type="text" id="videoUrl" placeholder="Pega aquí la URL de YouTube">
        <button id="addButton">Añadir a la Fila</button>
      </div>
      <div class="card">
        <h3>
          <span>En la Fila</span>
          <button id="refreshButton" title="Forzar actualización">Actualizar</button>
        </h3>
        <ul id="playlist"></ul>
      </div>
    </div>
  </div>
  
  <div id="toast"></div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzlWtRilp2KIAuvNQj0tGOzEvG2Bmpw8ah2gBmxHhTku4Cz-9UBKanKnVqfDNaENwpJ/exec';
    const POLLING_INTERVAL = 4000;

    let player;
    let localPlaylist = [];
    let localState = { currentVideoIndex: -1, lastUpdated: null };
    let changeRequest = { pending: false, index: null };
    const sessionId = Date.now().toString(36) + Math.random().toString(36).substring(2);

    document.addEventListener('DOMContentLoaded', () => {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        playerVars: { 'playsinline': 1 },
        events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerReady() {
      fetchState(true);
      setInterval(() => fetchState(false), POLLING_INTERVAL);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) { 
        updateStatus(`Reproduciendo: ${localPlaylist[localState.currentVideoIndex]?.title || 'Canción'}`);
      }
      if (event.data === YT.PlayerState.ENDED) {
        if (sessionStorage.getItem('yt-jukebox-dj') === 'true' && localPlaylist.length > 0) {
            const nextIndex = (localState.currentVideoIndex + 1) % localPlaylist.length;
            sendAction({ action: 'CHANGE_VIDEO', index: nextIndex });
        }
      }
    }
    
    async function fetchState(isInitialLoad) {
      const result = await sendAction({ action: 'GET_STATE' }, true);
      if (!result || !result.success) return;

      const { state, playlist } = result.data;
      
      if (isInitialLoad || state.lastUpdated > localState.lastUpdated) {
        if (!isInitialLoad && playlist.length > localPlaylist.length) {
            showToast("¡Nueva canción añadida!");
        }
        
        localState = state;
        localPlaylist = playlist;
        
        renderPlaylist();
        
        const currentPlayerVideoId = player.getVideoData().video_id;
        const serverVideoId = getYouTubeID(localPlaylist[state.currentVideoIndex]?.url);

        if (currentPlayerVideoId !== serverVideoId) {
            player.loadVideoById(serverVideoId);
        }
      }
    }
    
    async function sendAction(payload, isGet = false) {
        try {
            const url = isGet ? `${WEB_APP_URL}?sessionId=${sessionId}` : WEB_APP_URL;
            const options = isGet ? {} : {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ ...payload, sessionId })
            };
            const response = await fetch(url, options);
            return await response.json();
        } catch (error) {
            showToast("Error de conexión.");
            return { success: false };
        }
    }
    
    function requestSongChange(index) {
        if (sessionStorage.getItem('yt-jukebox-dj') === 'true') {
            const confirmed = confirm(`¿Estás seguro de cambiar a "${localPlaylist[index].title}" para todos?`);
            if (confirmed) {
                sendAction({ action: 'CHANGE_VIDEO', index });
            }
        } else {
            changeRequest = { pending: true, index };
            document.getElementById('password-modal').style.display = 'flex';
        }
    }
    
    async function handlePasswordSubmit() {
        const passwordInput = document.getElementById('password-input');
        const password = passwordInput.value;
        const errorDiv = document.getElementById('password-error');
        errorDiv.textContent = '';
        if (!password) return errorDiv.textContent = "Ingresa la contraseña.";

        const response = await sendAction({ action: 'VERIFY_PASSWORD', password });

        if (response.success) {
            sessionStorage.setItem('yt-jukebox-dj', 'true');
            document.getElementById('password-modal').style.display = 'none';
            passwordInput.value = '';
            showToast("Permiso concedido. Ahora puedes cambiar la canción.");
            if (changeRequest.pending) {
                requestSongChange(changeRequest.index);
                changeRequest = { pending: false, index: null };
            }
        } else {
            errorDiv.textContent = response.message || "Error.";
        }
    }

    document.getElementById('password-submit-button').addEventListener('click', handlePasswordSubmit);
    document.getElementById('password-input').addEventListener('keyup', (e) => e.key === 'Enter' && handlePasswordSubmit());
    
    document.getElementById('addButton').addEventListener('click', () => {
      const urlInput = document.getElementById('videoUrl');
      if (!urlInput.value) return showToast("Ingresa una URL.");
      sendAction({ action: 'ADD_VIDEO', url: urlInput.value }).then(res => {
          if (res.success) {
            urlInput.value = '';
            fetchState();
            showToast(res.message);
          } else {
            showToast(res.message || "Error al añadir.");
          }
      });
    });
    
    document.getElementById('refreshButton').addEventListener('click', () => fetchState());
    
    function renderPlaylist() {
      const playlistEl = document.getElementById('playlist');
      playlistEl.innerHTML = ''; // Limpia la lista actual
      
      localPlaylist.forEach((song, index) => {
        const li = document.createElement('li');
        li.className = 'playlist-item';
        
        li.innerHTML = `
          <img src="${song.thumbnail}" alt="Miniatura" class="playlist-item-thumbnail">
          <div class="playlist-item-info">
            <span class="playlist-item-title">${song.title}</span>
            <span class="playlist-item-author">${song.author}</span>
          </div>
        `;
        
        li.onclick = () => { if (index !== localState.currentVideoIndex) requestSongChange(index); };
        
        if (index === localState.currentVideoIndex) {
          li.classList.add('active');
        }
        
        playlistEl.appendChild(li);
      });
    }

    function getYouTubeID(url) {
      if (!url) return null;
      try { 
        const u = new URL(url);
        return u.hostname === "youtu.be" ? u.pathname.slice(1) : u.searchParams.get("v");
      } catch (e) {
        return null;
      }
    }
    
    function showToast(message) {
      const t = document.getElementById('toast');
      t.textContent = message; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    
    function updateStatus(message) {
      document.getElementById('statusDisplay').textContent = message;
    }
  </script>
</body>
</html>
