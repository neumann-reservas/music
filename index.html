<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Colaborativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F7F8FC; --card-color: #FFFFFF; --accent-color: #3662F1;
      --accent-hover: #2951D3; --text-primary: #1A1C20; --text-secondary: #6B7280;
      --border-color: #E5E7EB; --shadow: 0 4px 12px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color); color: var(--text-primary);
      transition: background-color 0.5s ease;
    }

    /* --- ESTILOS DE CARGA --- */
    body.loading::before {
      content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(270deg, #8A2BE2, #4A00E0, #FF007F, #00C2FF);
      background-size: 400% 400%; animation: gradientAnimation 15s ease infinite;
      z-index: 9998; opacity: 1; transition: opacity 0.5s ease;
    }
    #loader-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5);
      z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column;
      backdrop-filter: blur(5px); opacity: 1; transition: opacity 0.5s ease, visibility 0s 0s;
    }
    .loader { display: flex; align-items: flex-end; height: 50px; }
    .loader .bar { width: 8px; margin: 0 4px; background-color: white; border-radius: 4px; animation: equalizer 1.2s infinite ease-in-out; }
    .loader .bar:nth-child(2) { animation-delay: -1.0s; } .loader .bar:nth-child(3) { animation-delay: -0.8s; }
    .loader .bar:nth-child(4) { animation-delay: -0.6s; } .loader .bar:nth-child(5) { animation-delay: -0.4s; }
    .loader-text { color: white; margin-top: 20px; font-weight: 500; letter-spacing: 0.5px; }
    .app-container, .modal-overlay { display: none; opacity: 0; }
    body:not(.loading) .app-container { display: flex; opacity: 1; animation: fadeIn 0.5s ease-in-out; }
    body.loading #loader-overlay { display: flex; }
    body:not(.loading) #loader-overlay, body:not(.loading)::before { opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0s 0.5s; }
    @keyframes gradientAnimation { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    @keyframes equalizer { 0%, 100% { height: 10px; } 50% { height: 50px; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    /* --- FIN ESTILOS DE CARGA --- */

    .app-container { display: flex; flex-direction: row; width: 100%; height: 100%; }
    .main-content { flex-grow: 1; padding: 30px; display: flex; flex-direction: column; }
    .player-wrapper { flex-grow: 1; display: flex; flex-direction: column; gap: 20px; }
    .player-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background-color: #000; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    #verification-player { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; }
    .status-display { text-align: center; padding: 12px; font-size: 1em; font-weight: 500; color: var(--text-secondary); background-color: var(--card-color); border-radius: 10px; box-shadow: var(--shadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar { width: 380px; flex-shrink: 0; background-color: var(--card-color); padding: 20px; display: flex; flex-direction: column; gap: 20px; border-left: 1px solid var(--border-color); }
    .card h3 { margin-top: 0; margin-bottom: 20px; font-size: 1.1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    #videoUrl, #password-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; background-color: #F9FAFB; color: var(--text-primary); margin-bottom: 12px; font-size: 0.95rem; }
    #addButton, #refreshButton, #password-submit-button { width: 100%; padding: 12px; border: none; border-radius: 8px; background-color: var(--accent-color); color: white; font-weight: 600; cursor: pointer; transition: background-color 0.2s; font-size: 0.95rem; }
    #addButton:disabled { background-color: #9ca3af; cursor: not-allowed; }
    #password-submit-button:hover, #addButton:hover:not(:disabled) { background-color: var(--accent-hover); }
    #refreshButton { background-color: var(--text-secondary); padding: 0; width: 38px; height: 38px; font-size: 1.2rem; flex-shrink: 0; }
    
    /* --- SOLUCIÓN PARA LA BARRA DE DESPLAZAMIENTO --- */
    .card.playlist-card { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; /* Muy importante */ }
    .playlist-container { flex-grow: 1; overflow-y: auto; }
    /* --- FIN DE LA SOLUCIÓN --- */

    #playlist { list-style: none; padding: 0; margin: 0; }
    .playlist-item { display: flex; align-items: center; gap: 15px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; position: relative; }
    .playlist-item + .playlist-item { margin-top: 8px; }
    .playlist-item:hover { background-color: #F3F4F6; }
    .playlist-item.active { background-color: #EBF0FF; }
    .playlist-item-thumbnail { width: 80px; height: 45px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .playlist-item-info { display: flex; flex-direction: column; overflow: hidden; }
    .playlist-item-title { font-weight: 600; font-size: 0.9rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-item-author { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-item.active .playlist-item-title { color: var(--accent-color); }
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 14px 28px; background-color: #2c3e50; color: white; border-radius: 25px; opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s; z-index: 1000; box-shadow: var(--shadow); }
    #toast.show { opacity: 1; visibility: visible; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .modal-card { background: var(--card-color); padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
    .modal-error { color: #dc3545; margin-top: 10px; height: 20px; }
    
    @media (max-width: 900px) {
      body { overflow: auto; }
      .app-container { flex-direction: column; padding: 15px; height: auto; }
      .sidebar { width: 100%; order: -1; padding: 15px; height: auto; }
      .main-content { padding: 0; padding-top: 15px; }
      .card.playlist-card { overflow: visible; }
      .playlist-container { overflow-y: visible; max-height: none; }
    }
  </style>
</head>
<body class="loading">
  
  <div id="loader-overlay"> <div class="loader"> <div class="bar"></div> <div class="bar"></div> <div class="bar"></div> <div class="bar"></div> <div class="bar"></div> </div> <div class="loader-text">Conectando a la Jukebox...</div> </div>
  <div class="modal-overlay" id="password-modal"> <div class="modal-card"> <h3>Permiso de DJ Requerido</h3> <p>Ingresa la contraseña para poder cambiar la canción.</p> <input type="password" id="password-input" placeholder="Contraseña"> <button id="password-submit-button">Autorizar</button> <div class="modal-error" id="password-error"></div> </div> </div>
  
  <div class="app-container" id="app-container">
    <div class="main-content">
      <div class="player-wrapper">
        <div class="player-container"><div id="player"></div></div>
        <div id="statusDisplay" class="status-display">Conectando...</div>
      </div>
    </div>
    <div class="sidebar">
      <div class="card">
        <h3>Añadir Canción</h3>
        <input type="text" id="videoUrl" placeholder="Pega la URL de YouTube aquí">
        <button id="addButton">Añadir a la Fila</button>
      </div>
      <!-- Clase 'playlist-card' añadida para aplicar la solución de scroll -->
      <div class="card playlist-card">
        <h3> <span>Próximas en la Fila</span> <button id="refreshButton" title="Forzar actualización">↻</button> </h3>
        <div class="playlist-container"><ul id="playlist"></ul></div>
      </div>
    </div>
  </div>
  
  <div id="verification-player"></div> <div id="toast"></div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx0Z-TRJ2Yhq3kdDIBWuOmlJCIs8i25DOI_MuiqM93pOcqPNS1KvpOCet0SNsX_DV60/exec';
    const POLLING_INTERVAL = 4000;

    let player, verificationPlayer;
    let localPlaylist = [], localState = { currentVideoIndex: -1, lastUpdated: null };
    let changeRequest = { pending: false, index: null };
    const sessionId = Date.now().toString(36) + Math.random().toString(36).substring(2);

    document.addEventListener('DOMContentLoaded', () => {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', { playerVars: { 'playsinline': 1, 'controls': 1 }, events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange, 'onError': onPlayerError } });
      verificationPlayer = new YT.Player('verification-player', { width: 1, height: 1 });
    }

    function onPlayerReady() {
      fetchState(true).then(() => {
        document.body.classList.remove('loading');
      });
      setInterval(() => fetchState(false), POLLING_INTERVAL);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) { 
        updateStatus(`Ahora Suena: ${localPlaylist[localState.currentVideoIndex]?.title || 'Canción'}`);
        highlightCurrentVideo();
      }
      if (event.data === YT.PlayerState.ENDED) {
        if (sessionStorage.getItem('yt-jukebox-dj') === 'true' && localPlaylist.length > 0) {
            const nextIndex = (localState.currentVideoIndex + 1) % localPlaylist.length;
            sendAction({ action: 'CHANGE_VIDEO', index: nextIndex });
        }
      }
    }
    
    function onPlayerError(event) {
      showToast("Video no disponible. Saltando al siguiente...");
      setTimeout(() => {
        if (sessionStorage.getItem('yt-jukebox-dj') === 'true' && localPlaylist.length > 0) {
          const nextIndex = (localState.currentVideoIndex + 1) % localPlaylist.length;
          sendAction({ action: 'CHANGE_VIDEO', index: nextIndex });
        }
      }, 2000);
    }
    
    async function fetchState(isInitialLoad) {
      const result = await sendAction({ action: 'GET_STATE' }, true);
      if (!result || !result.success) return;

      const { state, playlist } = result.data;
      
      if (isInitialLoad || state.lastUpdated > localState.lastUpdated) {
        if (!isInitialLoad && playlist.length > localPlaylist.length) {
            showToast("¡Nueva canción añadida a la fila!");
        }
        
        localState = state;
        localPlaylist = playlist;
        
        renderPlaylist();
        
        const currentPlayerVideoId = player.getVideoData()?.video_id;
        const serverVideoId = getYouTubeID(localPlaylist[state.currentVideoIndex]?.url);

        if (serverVideoId && (isInitialLoad || currentPlayerVideoId !== serverVideoId)) {
            player.loadVideoById(serverVideoId);
        }
      }
    }
    
    async function sendAction(payload, isGet = false) {
      try {
        const url = isGet ? `${WEB_APP_URL}?sessionId=${sessionId}` : WEB_APP_URL;
        const options = isGet ? {} : {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ ...payload, sessionId })
        };
        const response = await fetch(url, options);
        return await response.json();
      } catch (error) {
        showToast("Error de conexión.");
        return { success: false };
      }
    }
    
    function requestSongChange(index) {
      if (sessionStorage.getItem('yt-jukebox-dj') === 'true') {
        const confirmed = confirm(`¿Estás seguro de cambiar a "${localPlaylist[index].title}" para todos?`);
        if (confirmed) sendAction({ action: 'CHANGE_VIDEO', index: index });
      } else {
        changeRequest = { pending: true, index: index };
        document.getElementById('password-modal').style.display = 'flex';
      }
    }
    
    async function handlePasswordSubmit() {
      const passwordInput = document.getElementById('password-input');
      const errorDiv = document.getElementById('password-error');
      errorDiv.textContent = '';
      if (!passwordInput.value) return errorDiv.textContent = "Ingresa la contraseña.";

      const response = await sendAction({ action: 'VERIFY_PASSWORD', password: passwordInput.value });

      if (response.success) {
        sessionStorage.setItem('yt-jukebox-dj', 'true');
        document.getElementById('password-modal').style.display = 'none';
        passwordInput.value = '';
        showToast("Permiso de DJ concedido.");
        if (changeRequest.pending) {
          requestSongChange(changeRequest.index);
          changeRequest = { pending: false, index: null };
        }
      } else {
        errorDiv.textContent = response.message || "Error.";
      }
    }

    document.getElementById('addButton').addEventListener('click', () => {
        const urlInput = document.getElementById('videoUrl');
        const url = urlInput.value;
        const videoId = getYouTubeID(url);
        if (!videoId) return showToast("URL de YouTube no válida.");
        
        const addButton = document.getElementById('addButton');
        addButton.disabled = true;
        addButton.textContent = 'Verificando...';

        let verificationTimeout;
        const cleanup = () => {
            clearTimeout(verificationTimeout);
            verificationPlayer.removeEventListener('onStateChange', onStateChangeVerification);
            verificationPlayer.removeEventListener('onError', onErrorVerification);
            addButton.disabled = false;
            addButton.textContent = 'Añadir a la Fila';
        };

        const onStateChangeVerification = (event) => {
            if (event.data === 5) { // 5 = CUED, video cargado y listo
                cleanup();
                sendAction({ action: 'ADD_VIDEO', url: url }).then(res => {
                    if (res.success) {
                        urlInput.value = '';
                        fetchState();
                    }
                    showToast(res.message || "Error al guardar.");
                });
            }
        };
        const onErrorVerification = (event) => {
            cleanup();
            showToast("Error: El video tiene copyright o no se puede añadir.");
        };
        
        verificationPlayer.addEventListener('onStateChange', onStateChangeVerification);
        verificationPlayer.addEventListener('onError', onErrorVerification);
        verificationPlayer.cueVideoById(videoId);

        verificationTimeout = setTimeout(() => {
             cleanup();
             showToast("La verificación del video tardó demasiado.");
        }, 7000);
    });

    document.getElementById('password-submit-button').addEventListener('click', handlePasswordSubmit);
    document.getElementById('password-input').addEventListener('keyup', (e) => e.key === 'Enter' && handlePasswordSubmit());
    document.getElementById('refreshButton').addEventListener('click', () => { fetchState(); showToast("Lista actualizada."); });
    
    function renderPlaylist() {
      const playlistEl = document.getElementById('playlist');
      playlistEl.innerHTML = '';
      
      localPlaylist.forEach((song, index) => {
        const li = document.createElement('li');
        li.className = 'playlist-item';
        
        li.innerHTML = `
          <img src="${song.thumbnail}" alt="Miniatura" class="playlist-item-thumbnail">
          <div class="playlist-item-info">
            <span class="playlist-item-title">${song.title}</span>
            <span class="playlist-item-author">${song.author}</span>
          </div>
        `;
        
        li.onclick = () => { if (index !== localState.currentVideoIndex) requestSongChange(index); };
        if (index === localState.currentVideoIndex) li.classList.add('active');
        
        playlistEl.appendChild(li);
      });
    }

    function getYouTubeID(url) { if (!url) return null; try { const u = new URL(url); return u.hostname === "youtu.be" ? u.pathname.slice(1) : u.searchParams.get("v"); } catch (e) { return null; } }
    function showToast(message) { const t = document.getElementById('toast'); t.textContent = message; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
    function updateStatus(message) { document.getElementById('statusDisplay').textContent = message; }
  </script>
</body>
</html>
